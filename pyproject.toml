[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "synced-lyrics"
version = "0.1.0"
description = "Time-synced song lyrics from LRCLIB with a Yandex Music fallback, checked against track length"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["aiohttp>=3.8"]
authors = [{name = "nowplaylab"}]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Framework :: AsyncIO"]

[project.urls]
Homepage = "https://github.com/nowplaylab/synced-lyrics"

[tool.setuptools]
packages = ["synced_lyrics"]
